name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version, without v (for example 0.1.0-meta.2)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a preview until full upstream platform acceptance is complete'
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check fork boundaries
        shell: pwsh
        run: |
          go vet -tags nogui ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -tags nogui ./internal/agent ./internal/profile ./internal/uninstall ./internal/gui ./internal/sessions ./internal/backup ./internal/davsync ./internal/cli ./internal/tui ./internal/update -run 'Test(GatewayOnly|ResourceManagement|ResourceRegistry|HistoryReference|Legacy|SyncPreservesManual|RunOrder|RunSaysWhatFailed|ZeroedProfiles)'
          exit $LASTEXITCODE
      - name: Build portable desktop
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./build/windows/release.ps1 -Version $env:RELEASE_VERSION -OutDir "$pwd/dist" -NotesFile "$pwd/docs/releases/windows-fork.md"
      - name: Publish on this fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIEW: ${{ inputs.prerelease }}
        run: |
          $flags = @('--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--notes-file', 'docs/releases/windows-fork.md', '--title', "Magpie $env:RELEASE_VERSION")
          if ($env:PREVIEW -eq 'true') { $flags += '--prerelease' }
          gh release create "v$env:RELEASE_VERSION" dist/magpie-windows-amd64.zip dist/magpie-windows-amd64.exe dist/update.json dist/notes.json @flags
          exit $LASTEXITCODE
